<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Metallic Chartreuse Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#82a600" />
    </linearGradient>
    
    <!-- Vector Laser Glow Filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Dark Precision Target Ring -->
  <circle cx="64" cy="64" r="58" fill="#020204" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(204, 255, 0, 0.03)" stroke-width="1.5" />
  
  <!-- Infinity Sound Loop (Torus Knot Figure-8 projection) -->
  <path d="M 36,64 C 36,44 50,28 64,64 C 78,100 92,84 92,64 C 92,44 78,28 64,64 C 50,100 36,84 36,64 Z" 
        fill="none" 
        stroke="url(#logo-grad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#logo-glow)" />
        
  <!-- Center Core Target Node -->
  <circle cx="64" cy="64" r="3.5" fill="#ccff00" />
</svg>